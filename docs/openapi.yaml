        '200': { description: OK }
    delete:
      tags: [Admin - Campaigns]
      summary: Delete campaign (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
  /admin/campaigns/{campaignId}/status:
    patch:
      tags: [Admin - Campaigns]
      summary: Toggle campaign status (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { description: OK }
  /admin/campaigns/{campaignId}/products:
    post:
      tags: [Admin - Campaigns]
      summary: Add product to campaign (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '200': { description: OK }
  /admin/campaigns/{campaignId}/products/{productId}:
    delete:
      tags: [Admin - Campaigns]
      summary: Remove product from campaign (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string }
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }

  /admin/orders:
    get:
      tags: [Admin - Orders]
      summary: List orders (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK }

  /admin/orders/returns:
    get:
      tags: [Admin - Orders]
      summary: List returns (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK }

  /admin/orders/top-ordered-products:
    get:
      tags: [Admin - Orders]
      summary: Top ordered products
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: startDate
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: endDate
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200': { description: OK }
  /admin/orders/{id}:
    get:
      tags: [Admin - Orders]
      summary: Get order by id (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    put:
      tags: [Admin - Orders]
      summary: Update order details (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingProgress:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        properties: { location: { type: string }, date: { type: string } },
                        required: [location, date],
                      },
                  }
                deliveryStatus:
                  { type: string, enum: ['Pending', 'Shipped', 'Out for Delivery', 'Delivered', 'Returned'] }
                status: { type: string, enum: ['Not Processed', 'Processing', 'Dispatched', 'Cancelled', 'Completed'] }
                shippingAddress: { type: object, additionalProperties: true }
                products: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Admin - Orders]
      summary: Reject order (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
  /admin/orders/{id}/delivery:
    patch:
      tags: [Admin - Orders]
      summary: Update delivery timeline
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeline]
              properties:
                timeline: { type: string }
      responses:
        '200': { description: OK }
  /admin/orders/{id}/cancel:
    delete:
      tags: [Admin - Orders]
      summary: Cancel order (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /admin/coupon-analytics/top:
    get:
      tags: [Admin - Analytics]
      summary: Get top coupons by redemptions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TopCouponItem' }
  /admin/coupon-analytics/{id}/summary:
    get:
      tags: [Admin - Analytics]
      summary: Get coupon summary
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/CouponSummary' }
  /admin/coupon-analytics/{id}/usage-by-day:
    get:
      tags: [Admin - Analytics]
      summary: Get coupon usage by day
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CouponUsageByDayItem' }
  /admin/coupon-analytics/{id}/users:
    get:
      tags: [Admin - Analytics]
      summary: Get users who redeemed a coupon
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CouponUserItem' }

  /admin/coupon:
    get:
      tags: [Admin - Coupons]
      summary: List coupons (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - in: query
          name: active
          required: false
          schema: { type: boolean }
          description: Filter by active status
        - in: query
          name: couponType
          required: false
          schema: { type: string, enum: [one-off, one-off-user, one-off-for-one-person, normal] }
          description: Filter by couponType
        - in: query
          name: startDateFrom
          required: false
          schema: { type: string, format: date-time }
          description: Filter coupons starting on/after this date
        - in: query
          name: startDateTo
          required: false
          schema: { type: string, format: date-time }
          description: Filter coupons starting on/before this date
        - in: query
          name: endDateFrom
          required: false
          schema: { type: string, format: date-time }
          description: Filter coupons ending on/after this date
        - in: query
          name: endDateTo
          required: false
          schema: { type: string, format: date-time }
          description: Filter coupons ending on/before this date
        - in: query
          name: search
          required: false
          schema: { type: string }
          description: Case-insensitive text search across coupon code & notes
        - in: query
          name: sort
          required: false
          schema: { type: string }
          description: "Comma separated sort fields. Prefix with '-' for desc. Allowed: createdAt,startDate,endDate,discount,timesUsed,coupon. Example: -createdAt,discount"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Coupon' }
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
                      appliedSort:
                        type: object
                        additionalProperties:
                          type: integer
                          enum: [1, -1]
                      appliedFilters: { type: object, additionalProperties: true }
                      search: { type: string, nullable: true }
    post:
      tags: [Admin - Coupons]
      summary: Create coupon (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCreateRequest'
      responses:
        '201': { description: Created }

  /admin/coupon/{id}:
    put:
      tags: [Admin - Coupons]
      summary: Update coupon (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponUpdateRequest'
      responses:
        '200': { description: OK }
    delete:
      tags: [Admin - Coupons]
      summary: Delete coupon (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 20 }
    FromParam:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    ToParam:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
  schemas:
    LogisticsCity:
      type: object
      properties:
        name: { type: string }
        code: { type: string }
        price: { type: number, minimum: 0 }
        etaDays: { type: integer, minimum: 0 }
    LogisticsLGA:
      type: object
      properties:
        name: { type: string }
        code: { type: string }
        price: { type: number, minimum: 0 }
        etaDays: { type: integer, minimum: 0 }
    LogisticsState:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string }
        fallbackPrice: { type: number, minimum: 0 }
        fallbackEtaDays: { type: integer, minimum: 0 }
        cities:
          type: array
          items: { $ref: '#/components/schemas/LogisticsCity' }
        lgas:
          type: array
          items: { $ref: '#/components/schemas/LogisticsLGA' }
    LogisticsConfig:
      type: object
      required: [countryCode, countryName, states]
      properties:
        countryCode: { type: string }
        countryName: { type: string }
        states:
          type: array
          items: { $ref: '#/components/schemas/LogisticsState' }
    LogisticsQuoteRequest:
      type: object
      required: [productId, destination]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
        destination:
          type: object
          required: [countryCode]
          properties:
            countryCode: { type: string }
            stateCode: { type: string }
            cityName: { type: string }
            lgaName: { type: string }
    LogisticsQuoteResponse:
      type: object
      properties:
        currency: { type: string }
        basePrice: { type: number }
        productShippingAdjustments:
          type: object
          properties:
            addedCost: { type: number }
            increaseCostBy: { type: number }
            addedDays: { type: integer }
        finalPrice: { type: number }
        etaDays: { type: integer }
        breakdown:
          type: object
          additionalProperties: true
    PricingTier:
      type: object
      required: [minQty, maxQty, strategy, value]
      properties:
        minQty: { type: integer, minimum: 1 }
        maxQty: { type: integer, minimum: 1, description: Must be >= minQty }
        strategy:
          type: string
          enum: [fixedPrice, percentOff, amountOff]
        value: { type: number, minimum: 0 }
      description: Non-overlapping ranges. Validation enforced in server.
    Settings:
      type: object
      additionalProperties: true
      properties:
        storeName: { type: string }
        currency: { type: string }
        supportEmail: { type: string, format: email }
    CreateOrderRequest:
      type: object
      required: [products, shippingAddress, paymentMethod, shippingPrice]
      properties:
        products:
          type: array
          items:
            type: object
            required: [product, qty]
            properties:
              product: { type: string, description: Product ID }
              qty: { type: integer, minimum: 1 }
              attributes:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    value: { type: string }
              sale: { type: string, description: Optional sale ID }
        shippingAddress:
          type: object
          additionalProperties: true
        paymentMethod: { type: string }
        paymentResult: { type: object, additionalProperties: true }
        total: { type: number, description: Client-computed total; server recomputes }
        totalBeforeDiscount: { type: number }
        couponApplied: { type: string, description: Coupon code if applied }
        shippingPrice: { type: number }
        taxPrice: { type: number, default: 0 }
        isPaid: { type: boolean, default: false }
        status: { type: string }
        deliveryStatus: { type: string }
        shippingProgress:
          type: array
          items:
            type: object
            required: [location, date]
            properties:
              location: { type: string }
              date: { type: string }
        flashSaleApplied: { type: object, additionalProperties: true }
    ShipmentStatus:
      type: string
      enum: [CREATED, PROCESSING, READY, DISPATCHED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, RETURNED, CANCELLED]
    CreateShipmentRequest:
      type: object
      required: [orderId, carrier]
      properties:
        orderId: { type: string }
        carrier: { type: string }
        trackingNumber: { type: string }
        estimatedDelivery: { type: string, format: date-time }
    UpdateShipmentRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        carrier: { type: string }
        trackingNumber: { type: string }
    UpdateShipmentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ShipmentStatus' }
    AddTrackingUpdateRequest:
      type: object
      required: [location, date]
      properties:
        location: { type: string }
        description: { type: string }
        date: { type: string, format: date-time }
    BulkUpdateShipmentStatusRequest:
      type: object
      required: [shipmentIds, status]
      properties:
        shipmentIds:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/ShipmentStatus' }

    AppliesTo:
      type: object
      properties:
        scope:
          type: string
          enum: [order, product, category]
          default: order
        productIds:
          type: array
          items: { type: string }
        categoryIds:
          type: array
          items: { type: string }

    Coupon:
      type: object
      properties:
        coupon: { type: string, minLength: 4, maxLength: 12 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        discount: { type: number, minimum: 0 }
        discountType: { type: string, enum: [percentage, fixed], default: percentage }
        minOrderValue: { type: number, minimum: 0 }
        appliesTo: { $ref: '#/components/schemas/AppliesTo' }
        stackable: { type: boolean, default: false }
        active: { type: boolean, default: true }
        timesUsed: { type: number, minimum: 0 }
        maxUsage: { type: number, nullable: true }
        maxUsagePerUser: { type: number, nullable: true }
        couponType: { type: string, enum: [one-off, one-off-user, one-off-for-one-person, normal], default: normal }
        allowedUser: { type: string, description: User ID permitted when type is one-off-for-one-person }
        usedBy:
          type: array
          items: { type: string }
        notes: { type: string }
        creator: { type: string, description: Admin user ID }
        deleted: { type: boolean, default: false }

    CouponCreateRequest:
      allOf:
        - $ref: '#/components/schemas/Coupon'
        - type: object
          required: [coupon, startDate, endDate, discount, discountType, creator]
          properties:
            timesUsed: { readOnly: true }
            deleted: { readOnly: true }
            usedBy: { readOnly: true }

    CouponUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/Coupon'
        - type: object
          properties:
            coupon: { type: string }
            startDate: { type: string, format: date-time }
            endDate: { type: string, format: date-time }
            discount: { type: number }
            discountType: { type: string, enum: [percentage, fixed] }
            minOrderValue: { type: number }
            appliesTo: { $ref: '#/components/schemas/AppliesTo' }
            stackable: { type: boolean }
            active: { type: boolean }
            maxUsage: { type: number, nullable: true }
            maxUsagePerUser: { type: number, nullable: true }
            couponType: { type: string, enum: [one-off, one-off-user, one-off-for-one-person, normal] }
            allowedUser: { type: string }
            notes: { type: string }
            creator: { type: string }
            timesUsed: { readOnly: true }
            usedBy: { readOnly: true }
            deleted: { readOnly: true }

    CouponSummary:
      type: object
      properties:
        totalRedemptions: { type: number }
        totalDiscount: { type: number }
        uniqueUsers: { type: number }

    CouponUsageByDayItem:
      type: object
      properties:
        date: { type: string, example: '2025-08-12' }
        count: { type: number }

    TopCouponItem:
      type: object
      properties:
        couponId: { type: string }
        redemptions: { type: number }
        totalDiscount: { type: number }

    CouponUserItem:
      type: object
      properties:
        userId: { type: string }
        times: { type: number }
    Campaign:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        active: { type: boolean }
        products:
          type: array
          items: { type: string }
    CampaignCreateRequest:
      allOf:
        - $ref: '#/components/schemas/Campaign'
        - type: object
          required: [name, startDate, endDate]
    CampaignUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/Campaign'
