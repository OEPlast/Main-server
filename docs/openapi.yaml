openapi: 3.1.0
info:
  title: OSL Old Main Server API
  version: 1.0.0
  description: REST API for the main e-commerce server (monolith)
servers:
  - url: http://localhost:4000
    description: Local
tags:
  - name: Auth
  - name: Products
  - name: Categories
  - name: Payments
  - name: Orders
  - name: Cart
  - name: Wishlist
  - name: Profile
  - name: Reviews
  - name: Settings
  - name: Inventory
  - name: Gallery
  - name: Logistics
  - name: FileUpload
  - name: Shipments
  # Admin groups
  - name: Admin - Products
  - name: Admin - Categories
  - name: Admin - Subcategories
  - name: Admin - Attributes
  - name: Admin - Gallery
  - name: Admin - Banners
  - name: Admin - Orders
  - name: Admin - Coupons
  - name: Admin - Users
  - name: Admin - Roles
  - name: Admin - Sales
  - name: Admin - Campaigns
  - name: Admin - Shipments
  - name: Admin - Inventory
  - name: Admin - Invoices
  - name: Admin - Analytics
  - name: Admin - Reviews
  - name: Misc
x-tagGroups:
  - name: Public
    tags:
      - Auth
      - Products
      - Categories
      - Gallery
      - Reviews
      - Payments
      - Inventory
      - FileUpload
      - Profile
      - Cart
      - Orders
      - Wishlist
      - Logistics
      - Shipments
      - Settings
      - Misc
  - name: Admin
    tags:
      - Admin - Products
      - Admin - Categories
      - Admin - Subcategories
      - Admin - Attributes
      - Admin - Gallery
      - Admin - Banners
      - Admin - Orders
      - Admin - Coupons
      - Admin - Users
      - Admin - Roles
      - Admin - Sales
      - Admin - Campaigns
      - Admin - Shipments
      - Admin - Inventory
      - Admin - Invoices
      - Admin - Analytics
      - Admin - Reviews
      - Misc
paths:
  /health-check:
    get:
      summary: Health
      tags: [Misc]
      responses:
        '200': { description: OK }

  # File Upload (Bunny Storage)
  /file/upload/single:
    post:
      tags: [FileUpload]
      summary: Upload a single image file to Bunny storage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (max 10MB)
                category:
                  type: string
                  description: Optional category bucket (sanitized & validated)
                  enum: [product, gallery, campaign, user, banner, general]
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      path: { type: string, description: Relative storage path inside zone }
                      url: { type: string, description: Public URL if configured }
                      size: { type: integer }
                      mimetype: { type: string }
                      originalName: { type: string }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '500': { description: Server error }

  /file/upload/multiple:
    post:
      tags: [FileUpload]
      summary: Upload multiple image files to Bunny storage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Up to 10 image files (each max 10MB)
                category:
                  type: string
                  description: Optional category bucket (sanitized & validated)
                  enum: [product, gallery, campaign, user, banner, general]
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        url: { type: string }
                        size: { type: integer }
                        mimetype: { type: string }
                        originalName: { type: string }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '500': { description: Server error }

  /file/files/category/{category}:
    get:
      tags: [FileUpload]
      summary: List files in a category (Bunny storage)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            enum: [product, gallery, campaign, user, banner, general]
          description: Category directory to list
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        '200':
          description: List retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          properties:
                            path: { type: string }
                            url: { type: string }
                            size: { type: integer }
                            mimetype: { type: string }
                            originalName: { type: string }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '500': { description: Server error }

  /file/files/{fileId}:
    delete:
      tags: [FileUpload]
      summary: Delete a file by relative path from Bunny storage
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: fileId
          required: true
          schema: { type: string }
          description: Relative path (e.g. product/file-123.png)
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }
        '401': { description: Unauthorized }
        '500': { description: Server error }

  # Auth (public)
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Logged in }
  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '201': { description: Registered }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '200': { description: Logged out }
  /auth/changePassword:
    post:
      tags: [Auth]
      summary: Change password
      responses:
        '200': { description: Changed }
  /auth/requestResetPasswordCode:
    post:
      tags: [Auth]
      summary: Request reset code
      responses:
        '200': { description: Sent }
  /auth/resetPasswordByCode:
    post:
      tags: [Auth]
      summary: Reset password by code
      responses:
        '200': { description: Reset }
  /auth/verifyAccountOtp:
    post:
      tags: [Auth]
      summary: Verify account OTP
      responses:
        '200': { description: Verified }
  /auth/resendVerifyAccountOtp:
    post:
      tags: [Auth]
      summary: Resend account OTP
      responses:
        '200': { description: Sent }

  # Products (public)
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200': { description: OK }
  /products/search:
    get:
      tags: [Products]
      summary: Search products
      responses:
        '200': { description: OK }
  /products/week:
    get:
      tags: [Products]
      summary: Weekly products
      responses:
        '200': { description: OK }
  /products/top-sold:
    get:
      tags: [Products]
      summary: Top sold products
      responses:
        '200': { description: OK }
  /products/hot-sales:
    get:
      tags: [Products]
      summary: Hot sales
      responses:
        '200': { description: OK }
  /products/recommendation:
    get:
      tags: [Products]
      summary: Recommendations
      responses:
        '200': { description: OK }
  /products/recommendation4u:
    get:
      tags: [Products]
      summary: Personalized recommendations
      responses:
        '200': { description: OK }
  /products/categoryNSub/{category}/{subCat}:
    get:
      tags: [Products]
      summary: Products by category and subcategory
      parameters:
        - in: path
          name: category
          required: true
          schema: { type: string }
        - in: path
          name: subCat
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /products/category/{slug}:
    get:
      tags: [Products]
      summary: Products by category slug (with descendants)
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, price_asc, price_desc, popular]
            default: newest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: integer, example: 200 }
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      slug: { type: string }
  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /products/slug/{slug}:
    get:
      tags: [Products]
      summary: Get product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: integer }
                  data:
                    type: object
                    additionalProperties: true

  # Categories (public)
  /categories:
    get:
      tags: [Categories]
      summary: Get all categories
      responses:
        '200': { description: OK }

  # Banners (public)
  /banners:
    get:
      tags: [Gallery]
      summary: Get banners
      responses:
        '200': { description: OK }
  /banners/{id}:
    get:
      tags: [Gallery]
      summary: Get banner by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  # Gallery (public)
  /gallery:
    get:
      tags: [Gallery]
      summary: List gallery images
      responses:
        '200': { description: OK }
  /gallery/{id}:
    get:
      tags: [Gallery]
      summary: Get gallery item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  # Public reviews
  /reviews/product/{productId}:
    get:
      tags: [Reviews]
      summary: Get product reviews (public)
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  # General reviews (mixed)
  /reviews/{reviewId}/likeCount:
    get:
      tags: [Reviews]
      summary: Like count
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /reviews:
    post:
      tags: [Reviews]
      summary: Create review
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /reviews/{reviewId}:
    put:
      tags: [Reviews]
      summary: Update review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Reviews]
      summary: Delete review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
  /reviews/{reviewId}/like:
    post:
      tags: [Reviews]
      summary: Like review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /reviews/{reviewId}/unlike:
    post:
      tags: [Reviews]
      summary: Unlike review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  # Payments
  /payments/initialize:
    post:
      tags: [Payments]
      summary: Initialize payment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, email, amount]
              properties:
                orderId: { type: string }
                email: { type: string, format: email }
                amount: { type: number }
                currency: { type: string, default: NGN }
                metadata: { type: object }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      paymentUrl: { type: string }
                      reference: { type: string }
                      payment:
                        type: object
                        additionalProperties: true
  /payments/verify/{reference}:
    get:
      tags: [Payments]
      summary: Verify payment
      parameters:
        - in: path
          name: reference
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Payment verified successfully }
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      _id: { type: string, description: Payment id }
                      orderId: { type: string }
                      userId: { type: string }
                      paymentId: { type: string }
                      paymentMethod:
                        type: string
                        enum: [stripe, paystack, flutterwave, bank_transfer, cash_on_delivery]
                      paymentGateway:
                        type: string
                        enum: [stripe, paystack, flutterwave, manual]
                      amount: { type: number }
                      currency: { type: string, example: NGN }
                      status:
                        type: string
                        enum: [pending, completed, failed, cancelled, refunded, partially_refunded]
                      transactionId: { type: string, description: Gateway reference }
                      gatewayResponse: { type: object, additionalProperties: true }
                      fees:
                        type: object
                        properties:
                          gatewayFee: { type: number }
                          processingFee: { type: number }
                          totalFees: { type: number }
                      customerInfo:
                        type: object
                        properties:
                          email: { type: string, format: email }
                          name: { type: string }
                          phone: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
        '400': { description: Verification failed }
        '404': { description: Payment not found }
        '500': { description: Server error }
  /payments/webhook:
    post:
      tags: [Payments]
      summary: Paystack webhook
      parameters:
        - in: header
          name: x-paystack-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event:
                  type: string
                  enum: [charge.success, charge.failed]
                  example: charge.success
                data:
                  type: object
                  properties:
                    reference: { type: string }
                    status: { type: string, example: success }
                    id: { type: string, description: Paystack transaction id }
                    amount: { type: number, description: Amount in kobo for NGN }
                    fees: { type: number }
                    gateway_response: { type: string }
                    paid_at: { type: string, format: date-time }
                    channel: { type: string }
                    customer:
                      type: object
                      properties:
                        email: { type: string, format: email }
                    metadata: { type: object, additionalProperties: true }
            examples:
              success:
                value:
                  event: charge.success
                  data:
                    reference: 'ORDER_ID_STRING'
                    status: success
                    id: '1234567890'
                    amount: 250000
                    fees: 3750
                    gateway_response: Approved
                    paid_at: '2025-08-12T10:15:30Z'
                    channel: card
                    customer: { email: user@example.com }
                    metadata: { orderId: '...', userId: '...' }
      responses:
        '200':
          description: Processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Webhook processed successfully }
                  code: { type: integer, example: 200 }
                  data: { type: string, example: OK }
        '401': { description: Invalid signature }
        '500': { description: Server error }
  /payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Get payment by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /payments/user/payments:
    get:
      tags: [Payments]
      summary: Get user payments
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /payments/reference/{reference}:
    get:
      tags: [Payments]
      summary: Get payment by reference (auth)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reference
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /payments/{paymentId}/refund:
    post:
      tags: [Payments]
      summary: Refund payment (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '400': { description: Cannot refund }

  # ...existing code...

  # Inventory
  /inventory/{productId}/availability:
    get:
      tags: [Inventory]
      summary: Check availability
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /inventory/{productId}/stock:
    post:
      tags: [Inventory]
      summary: Adjust stock (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /inventory/{productId}/reserve:
    post:
      tags: [Inventory]
      summary: Reserve items for checkout
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  # File Upload (current)
  /files/upload/single:
    post:
      tags: [FileUpload]
      summary: Upload single file
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Uploaded }
  /files/upload/multiple:
    post:
      tags: [FileUpload]
      summary: Upload multiple files
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Uploaded }
  /files/category/{category}:
    get:
      tags: [FileUpload]
      summary: List files by category
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: category
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  # (Delete endpoint currently disabled in code)

  # User profile (original base paths retained until route refactor)
  /profile:
    get:
      tags: [Profile]
      summary: Get profile (deprecated - replaced by /user/profile in code)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    put:
      tags: [Profile]
      summary: Update profile (deprecated)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /profile/password:
    put:
      tags: [Profile]
      summary: Change password (deprecated)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /profile/addresses:
    post:
      tags: [Profile]
      summary: Add address (deprecated)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
    get:
      tags: [Profile]
      summary: List addresses (deprecated)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /profile/addresses/{addressId}:
    put:
      tags: [Profile]
      summary: Update address (deprecated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    delete:
      tags: [Profile]
      summary: Delete address (deprecated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }

  # Wishlist
  /wishlist/add:
    post:
      tags: [Wishlist]
      summary: Add to wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Added }
  /wishlist/{id}:
    delete:
      tags: [Wishlist]
      summary: Remove from wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
  /wishlist/all:
    get:
      tags: [Wishlist]
      summary: List wishlist items
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /wishlist/count:
    get:
      tags: [Wishlist]
      summary: Count wishlist items
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  # Cart
  /carts:
    get:
      tags: [Cart]
      summary: Get cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /carts/add:
    post:
      tags: [Cart]
      summary: Add to cart
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Added }
  /carts/clear:
    post:
      tags: [Cart]
      summary: Clear cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cleared }
  /carts/update/{id}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /carts/remove/{id}:
    patch:
      tags: [Cart]
      summary: Remove cart item
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /carts/validate-sales:
    get:
      tags: [Cart]
      summary: Validate sales and discounts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

